<div class="processing-container">
  <!-- Sidebar for File Upload and Selection -->
  <div class="sidebar">
    <h3>File Tree</h3>
    <div class="file-tree-container">
      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="mat-tree">
        <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
          <button mat-icon-button disabled></button>
          {{node.name}}
        </mat-tree-node>
        <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding>
          <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'toggle ' + node.filename">
            <mat-icon class="mat-icon-rtl-mirror">
              {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
            </mat-icon>
          </button>
          {{node.name}}
        </mat-tree-node>
      </mat-tree>
    </div>
    <div class="upload-section">
      <input type="file" id="fileUpload" multiple (change)="onFileSelected($event)" />
      <label for="fileUpload" class="upload-label">
        <span>{{ selectedFileName || 'Select Files...' }}</span>
      </label>
      <button class="upload-button" (click)="uploadFiles()">Upload</button>
      <button class="delete-button" (click)="deleteFiles()">Delete</button>
      <button class="confirm-button" (click)="confirmFiles()">Confirm</button>
    </div>
  </div>

  <!-- Section for Image and Details -->
  <div class="details-section">
    <img src="image-placeholder.png" alt="Processing Image" />
    <div class="details">
      <h3>File Details</h3>
      <p *ngIf="!fileTree">No file tree data available.</p>
      <p *ngIf="fileTree">{{ fileTree | json }}</p>
    </div>
  </div>
</div>
