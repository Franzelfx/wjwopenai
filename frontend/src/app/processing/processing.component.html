<div class="processing-container">
  <!-- Upload Section -->
  <div class="upload-section">
    <app-upload [projectId]="projectId"></app-upload>
  </div>

  <!-- Results Section -->
  <div class="results-section">
    <app-results [projectId]="projectId"></app-results>
  </div>
</div>

<!-- Progress Bar always at the bottom -->
<app-progress-bar
  [progress]="progress"
  [status]="status"
></app-progress-bar>
