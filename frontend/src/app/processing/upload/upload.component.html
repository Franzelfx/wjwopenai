<!-- upload.component.html -->
<div class="processing-container">
  <div class="sidebar">
    <h3>Folder Structure</h3>
    <div class="header-line"></div>

    <div class="file-tree-container">
      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
        <!-- Folder Node -->
        <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding>
          <button mat-icon-button matTreeNodeToggle>
            <mat-icon>
              {{ treeControl.isExpanded(node) ? 'folder_open' : 'folder' }}
            </mat-icon>
          </button>
          <span
            (click)="selectItem(node)"
            [class.selected]="selectedItem?.name === node.name"
            [class.file]="!node.expandable"
          >
            {{ node.name }}
          </span>
        </mat-tree-node>

        <!-- File Node -->
        <mat-tree-node *matTreeNodeDef="let node; when: !hasChild" matTreeNodePadding>
          <span
            class="file-node"
            (click)="selectItem(node)"
            [class.selected]="selectedItem?.name === node.name"
          >
            <mat-icon class="file-icon">insert_drive_file</mat-icon>
            {{ node.name }}
          </span>
        </mat-tree-node>
      </mat-tree>
    </div>

    <div class="upload-section">
      <!-- single folder-picker “button” -->
      <label class="upload-label">
        <input type="file"
               webkitdirectory
               (change)="onFolderSelected($event)"
               hidden>
        {{ selectedFolderName || 'Select Folder…' }}
      </label>

      <button class="upload-button"
              (click)="uploadFolder()"
              [disabled]="!inputFiles.length">
        Upload Folder
      </button>

      <button class="delete-button"
              (click)="deleteSelectedItem()"
              [disabled]="!selectedItem">
        Delete
      </button>

      <!-- Recorder‐style OCR controls -->
      <div class="ocr-controls">
        <button
          mat-icon-button
          class="ocr-toggle"
          (click)="togglePlayPause()"
          [attr.aria-label]="
            ocrState === 'in_progress'
              ? 'Pause OCR'
              : ocrState === 'paused'
                ? 'Resume OCR'
                : 'Start OCR'
          "
        >
          <mat-icon>
            {{ ocrState === 'in_progress' ? 'pause' : 'play_arrow' }}
          </mat-icon>
        </button>

        <button
          mat-icon-button
          class="ocr-stop"
          (click)="stopOCR()"
          [disabled]="ocrState === 'idle'"
          aria-label="Stop OCR"
        >
          <mat-icon>stop</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
