<div class="json-editor-container" *ngIf="!isLoading; else loadingTpl">
  <!-- Associated image preview (shown once the first matching image loads) -->
  <div class="image-container" *ngIf="imageUrl">
    <img [src]="imageUrl" alt="Preview" class="image-preview" />
  </div>

  <!-- JSON editor -->
  <textarea
    id="json-editor"
    [formControl]="jsonControl"
    (input)="onEditorInput()"
    spellcheck="false"
  ></textarea>

  <!-- Buttons + validation message -->
  <div class="button-row">
    <button (click)="submit()" [disabled]="!isJsonValid">Save</button>
    <span class="error" *ngIf="!isJsonValid">Invalid JSON syntax</span>
  </div>
</div>

<ng-template #loadingTpl>
  <p class="loading">Loading…</p>
</ng-template>
